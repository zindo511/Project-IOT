[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-security-mvp"
version = "0.1.0"
description = "ESP32-CAM smart security demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "Pillow>=10.4,<12",
]

[project.optional-dependencies]
vision = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "onnxruntime>=1.19,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

