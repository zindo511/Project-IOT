<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Security MVP</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">SMART SECURITY MVP</p>
        <h1>Giám sát lối tiếp cận</h1>
      </div>
      <span id="mode" class="status">Đang tải…</span>
    </header>

    <section class="controls" aria-label="Điều khiển hệ thống">
      <button data-mode="ARMED">Arm</button>
      <button data-mode="DISARMED" class="secondary">Disarm</button>
      <button id="silence" class="danger">Silence</button>
      <button id="refresh" class="secondary">Làm mới</button>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>Thiết bị</h2>
        <div id="devices" class="empty">Chưa có thiết bị gửi ảnh.</div>
      </article>
      <article class="panel">
        <h2>Quy tắc đang dùng</h2>
        <p id="policy">Đang tải…</p>
        <p class="muted">Thiếu bằng chứng A → B hoặc mặt chưa rõ sẽ không bật còi.</p>
      </article>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>Lịch sử sự kiện</h2>
        <span class="muted">Mới nhất trước</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Thời gian</th><th>Mức</th><th>Lý do</th><th>Visit</th><th>Trạng thái</th></tr></thead>
          <tbody id="events"><tr><td colspan="5" class="empty">Chưa có sự kiện.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
